<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="hd">
      <img src="../icons/icon32.png" width="22" height="22" alt="" />
      <div class="ttl">Meet AI Copilot</div>
      <label class="sw">
        <input type="checkbox" id="enabled" />
        <span class="track"></span>
      </label>
    </div>

    <div class="field">
      <label for="apiKey">Anthropic API key</label>
      <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off" />
      <div class="hint" id="keyHint">Stored locally in this browser only.</div>
    </div>

    <div class="field">
      <label for="userName">Your name in Meet</label>
      <input id="userName" type="text" placeholder="e.g. Jake Austin" />
      <div class="hint">Used to tell your lines from everyone else's.</div>
    </div>

    <div class="field">
      <label for="answerModel">Answer model</label>
      <select id="answerModel">
        <option value="claude-sonnet-5">Sonnet 5 — balanced (recommended)</option>
        <option value="claude-haiku-4-5">Haiku 4.5 — cheapest & fastest</option>
        <option value="claude-opus-4-8">Opus 4.8 — highest quality</option>
        <option value="claude-fable-5">Fable 5 — most capable</option>
      </select>
    </div>

    <div class="row">
      <label class="chk"><input type="checkbox" id="autoSuggest" /> Auto-suggest</label>
      <label class="chk"><input type="checkbox" id="useGate" /> Cheap gate</label>
    </div>

    <div class="actions">
      <button id="toggle" class="ghost">Show / hide panel</button>
      <button id="save" class="primary">Save</button>
    </div>
    <a href="#" id="opts" class="more">More settings & cost tips →</a>
    <div class="saved" id="saved">Saved</div>

    <script src="popup.js"></script>
  </body>
</html>
