# Serves the built SPA and proxies API + WebSocket to the backend `api` service.
# `api` resolves via docker-compose's service network (integration wires this in).

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: unknown paths return index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # REST → FastAPI.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # WebSocket → FastAPI (/ws/jobs).
  location /ws/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
}
