<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hdr">
      <span class="hdr-icon">🕑</span>
      <h1>Scheduled messages</h1>
    </header>
    <div id="weekend-banner" class="weekend-banner" hidden></div>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>No scheduled messages yet. Open a chat in WhatsApp Web, type a message, and click the clock icon.</p>
    <footer class="foot">
      <a href="https://web.whatsapp.com/" target="_blank" rel="noopener">Open WhatsApp Web</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
