name: Build StageMix APK

on:
  push:
    branches: ["**"]
    paths: ["stagemix/**", ".github/workflows/stagemix-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stagemix
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine unit tests
        run: ./gradlew :engine:test --console=plain

      - name: Replay + bench tests
        run: ./gradlew :replay:test :virtualm18:test --console=plain

      - name: Build the desktop jars
        run: ./gradlew :replay:fatJar :virtualm18:fatJar --console=plain

      - name: Collect the desktop jars
        run: |
          cp replay/build/libs/stagemix-replay.jar stagemix-replay.jar
          cp virtualm18/build/libs/virtual-m18.jar virtual-m18.jar

      - name: Build release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk StageMix.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StageMix-apk
          path: |
            stagemix/StageMix.apk
            stagemix/stagemix-replay.jar
            stagemix/virtual-m18.jar

      - name: Update rolling release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stagemix-latest
          name: StageMix AI — latest build
          prerelease: true
          files: |
            stagemix/StageMix.apk
            stagemix/stagemix-replay.jar
            stagemix/virtual-m18.jar
          body: |
            ## StageMix AI — the FOH autopilot for the Midas M18

            **StageMix.apk** — the tablet app. It leads the MAIN mix all
            night, with no soundcheck ritual, and **never touches the six
            monitor buses**: monitors stay 100 % yours in Mixing Station.
            Download it on the tablet, open it, and allow "install unknown
            apps" when asked. It installs over the previous version.

            1. Put the tablet on the M18's Wi-Fi. Open StageMix — it finds
               the mixer and reads your channel names by itself.
            2. Rough the faders in anywhere sane. Mix your monitors in
               Mixing Station as usual.
            3. Flip **MIXING** on. It takes over the mains, listens ~20 s,
               then leads: kick+bass foundation, the lead vocal on top,
               lead-follow between the vocal mics, feature holds for
               solos, idle easing, howl watchdog, freeze-on-anything-odd.
            4. **Hand back the mains** any time. At the end of the night,
               **⤴ EXPORT LOG** sends the whole night to WhatsApp.

            ### Testing it without a console

            **VirtualM18-AppleSilicon.dmg** — a virtual M18 for a Mac.
            Drag *Virtual M18* to Applications and open it (unsigned, so
            the first launch needs right-click → Open, and say yes to the
            incoming-connections prompt). Load a night the desk recorded —
            click a strip for one channel at a time, or *Choose folder…*
            for the lot; WAV, MP3 and AIFF all work. Point the tablet at
            the Mac's IP, press PLAY, and **the faders the app writes are
            applied to the audio coming out of the speakers**: you hear
            the mix it is making while you watch it work.

            **stagemix-replay.jar** — replays a recorded night through the
            same engine offline, renders the mix it would have made, and
            can write a ~1 MB "meter tape" of a whole night so the audio
            never has to leave the machine it was recorded on. Needs
            Java 17. **virtual-m18.jar** is the bench for non-Mac boxes.

            The mixer keeps your last mix if the app ever disconnects —
            fail-safe by design.

  # A double-clickable Mac app for the bench, with its own Java runtime
  # bundled — nothing to install on the Mac mini.
  mac-bench:
    runs-on: macos-14          # Apple Silicon
    defaults:
      run:
        working-directory: stagemix
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the bench jar
        run: ./gradlew :virtualm18:fatJar --console=plain

      - name: Package it as a Mac app
        run: |
          mkdir -p jpkg/input
          cp virtualm18/build/libs/virtual-m18.jar jpkg/input/
          jpackage \
            --type dmg \
            --name "Virtual M18" \
            --app-version 1.0.0 \
            --vendor "StageMix" \
            --description "A virtual Midas M18 for testing StageMix" \
            --input jpkg/input \
            --main-jar virtual-m18.jar \
            --main-class com.stagemix.vm18.MainKt \
            --mac-package-identifier com.stagemix.vm18 \
            --dest jpkg/out
          mv "jpkg/out/Virtual M18-1.0.0.dmg" VirtualM18-AppleSilicon.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualM18-dmg
          path: stagemix/VirtualM18-AppleSilicon.dmg

      - name: Attach to the rolling release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref_name, 'claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stagemix-latest
          name: StageMix AI — latest build
          prerelease: true
          files: stagemix/VirtualM18-AppleSilicon.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
