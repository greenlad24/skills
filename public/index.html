<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Vibration &middot; Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;color:#EFEBE2;
  font-family:'Jost',system-ui,sans-serif;overscroll-behavior:none}

/* ================= HOME ================= */
#home{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:#000;
  padding:calc(env(safe-area-inset-top,0px) + 3vh) clamp(14px,4vw,28px) calc(env(safe-area-inset-bottom,0px) + 2.4vh);
  transition:opacity .34s, transform .34s}
#home.gone{opacity:0;transform:scale(.97);pointer-events:none}
#home .brand{flex:0 0 auto;width:100%;max-width:620px;margin:0 auto;text-align:center;margin-bottom:2.1vh}
#home .brand svg{width:min(36vw,180px);height:auto;display:block;margin:0 auto}
#home .brand .tag{margin-top:1vh;font-size:clamp(8px,2.1vw,11px);letter-spacing:.42em;
  text-transform:uppercase;color:#8D8778;padding-left:.42em}
#grid{flex:1 1 auto;width:100%;max-width:620px;margin:0 auto;display:grid;grid-template-rows:repeat(5,1fr);gap:1.5vh;min-height:0}
.card{position:relative;border-radius:12px;overflow:hidden;border:1px solid rgba(201,169,106,.34);
  cursor:pointer;min-height:0;background:#0a0a0a}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 62%;opacity:.62}
.card .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.6) 46%,rgba(0,0,0,.22) 100%)}
.card .lbl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding-left:5.5vw}
/* home titles +20% */
.card .lbl h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
  /* --cardfs is set from the measured card height, so titles stay in proportion
     however many cards the grid holds. The clamp keeps it readable either way. */
  font-size:clamp(21px,var(--cardfs,6.7vw),41px);color:#F4F0E6;line-height:1.05}
.card .lbl span{margin-top:.6vh;font-size:clamp(10px,2.6vw,12px);letter-spacing:.2em;
  text-transform:uppercase;color:#C9A96A;padding-left:.2em}
.card .arw{position:absolute;right:5vw;top:50%;transform:translateY(-50%);color:#C9A96A;font-size:clamp(14px,3.4vw,19px)}
#home .foot{flex:0 0 auto;text-align:center;margin-top:1.6vh;font-size:clamp(7px,1.9vw,10px);
  letter-spacing:.34em;text-transform:uppercase;color:#5C574C;padding-left:.34em}

/* ================= VIEWER ================= */
#viewer{position:fixed;inset:0;z-index:10;display:none;background:#000}
#viewer.on{display:block}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:pan-y pinch-zoom}
#track{display:flex;height:100%;width:100%;will-change:transform}
.slide{flex:0 0 100%;width:100%;height:100%;position:relative;overflow:hidden;background:#000}
.slide.scrolly{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.slide.scrolly::-webkit-scrollbar{width:0}

/* fixed design canvas, scaled to fit the screen */
.itempage{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;
  max-width:758px;overflow:hidden;background:#000;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 70px) clamp(16px,5vw,34px) calc(env(safe-area-inset-bottom,0px) + 44px)}
/* eyebrow */
.itempage .eyeb{order:-3;flex:0 0 auto;width:100%;max-width:620px;margin:0 auto;text-align:center;font-size:clamp(14px,2.7vw,17px);letter-spacing:.5em;
  color:#8D8778;text-transform:uppercase;padding-left:.5em;font-weight:400}
.itempage .eyerl{order:-2;flex:0 0 auto;width:88px;height:1px;margin:10px auto 0;
  background:linear-gradient(90deg,transparent,rgba(201,169,106,.5),transparent)}
/* hero owns the space above the text and can never sit behind it */
.itempage .herobox{order:-1;flex:1 1 auto;min-height:0;position:relative;overflow:hidden;
  margin-top:clamp(6px,1.2vh,18px)}
/* --fy / --z are set per image from where the subject sits in that photo, so a
   wide plate is not cropped and a tall glass is not cut off. Defaults apply if
   an image has no framing data. */
.itempage .herobox img{width:100%;max-width:690px;height:100%;object-fit:cover;
  object-position:center var(--fy,35%);display:block;margin:0 auto;transform:scale(var(--z,1.2))}
.itempage .herobox::after{content:'';position:absolute;left:-6vw;right:-6vw;bottom:0;height:26%;
  background:linear-gradient(180deg,rgba(0,0,0,0),#000 100%);pointer-events:none}
.itempage .fadeT,.itempage .fadeB{display:none}
/* text block */
.itempage .txt{order:1;flex:0 0 auto;width:100%;max-width:620px;margin:0 auto;text-align:center;padding-top:clamp(4px,1vh,14px)}
.itempage .nm{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
  font-size:clamp(30px,8.6vw,66px);line-height:1.05;color:#F4F0E6;white-space:nowrap}
.itempage .st{margin-top:.7em;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
  font-size:clamp(16px,4.3vw,32px);color:#EAE6DC;line-height:1.35}
.itempage .bd{margin-top:1em;font-size:clamp(14px,2.15vw,23px);letter-spacing:.18em;
  text-transform:uppercase;color:#C6BFAF;line-height:1.5;padding-left:.18em}
.itempage .bd .dot{color:#C9A96A;padding:0 .5em}
.itempage .sv{margin-top:1.05em;display:inline-flex;align-items:center;gap:clamp(12px,3.4vw,26px);
  font-size:clamp(13px,1.85vw,21px);letter-spacing:.22em;text-transform:uppercase;color:#D8D2C4;
  font-weight:500;padding-left:.22em;max-width:100%;flex-wrap:wrap;justify-content:center;white-space:normal}
.itempage .sv .lbl{white-space:normal}
.itempage .sv.norule::before,.itempage .sv.norule::after{display:none}
.itempage .sv.norule{gap:0}
.itempage .sv::before,.itempage .sv::after{content:'';flex:0 0 auto;width:clamp(26px,7vw,60px);height:1px;background:rgba(201,169,106,.45)}
.itempage .pr{margin-top:.55em;font-family:'Jost',sans-serif;font-weight:400;
  font-size:clamp(20px,5vw,54px);color:#C9A96A;letter-spacing:.05em;line-height:1.1}
@media (max-width:699px){
  .itempage .sv{display:none}
  .itempage .bd{font-size:clamp(10.4px,3.25vw,18.2px);letter-spacing:.1em;white-space:nowrap}
  .itempage .bd .dot{padding:0 .3em}
}
.itempage .pr small{font-size:clamp(14px,2.8vw,24px);color:#8D8778;letter-spacing:.3em;vertical-align:middle;margin-right:.35em}
.itempage .pr .bar{color:#6E675C;font-weight:300;margin:0 .28em;vertical-align:middle}
.itempage .pr .split{font-size:1em}
.itempage .pr .split small{font-size:clamp(14px,2.8vw,24px)}
.itempage .pr .split .sz{color:#8D8778;font-size:clamp(14px,2.6vw,22px);letter-spacing:.18em;margin-right:.3em;vertical-align:middle}
.itempage .pr .split .gap{display:inline-block;width:.6em}


/* tablet & up: same proportions, 10% smaller than the phone-scaled maximums */
@media (min-width:700px){
  /* hero 20% smaller on bigger screens, centred in its area */
  .itempage .herobox{display:flex;align-items:center;justify-content:center}
  .itempage .herobox img{width:100%;height:100%;max-height:741px;object-fit:cover;object-position:center 25%;
    margin:0 auto;transform:none}
  .itempage .eyeb{font-size:15px}
  .itempage .nm{font-size:52px}
  .itempage .st{font-size:25px}
  .itempage .bd{font-size:18px}
  .itempage .sv{font-size:16px}
  .itempage .pr{font-size:43px}
  .itempage .pr small,.itempage .pr .split small{font-size:19px}
  .itempage .pr .split .sz{font-size:17px}
  .listpage .lp-eyebrow{font-size:15px}
  .listpage .lp-title{font-size:50px}
  .listpage .lp-cat{font-size:16px}
  .listpage .lp-nm,.listpage .lp-pr{font-size:18px}
  .listpage .lp-end{font-size:14px}
}


/* back cover */
.backpage{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;
  background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 80px) clamp(22px,6vw,40px) calc(env(safe-area-inset-bottom,0px) + 46px)}
.backpage .bp-glow{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
  width:120%;height:46%;background:radial-gradient(ellipse at center,rgba(201,169,106,.13),transparent 66%);pointer-events:none}
.backpage img{width:clamp(150px,42vw,230px);display:block;margin:0 auto;position:relative}
.backpage .bp-kick{margin-top:clamp(26px,5vh,54px);font-size:clamp(12px,2.6vw,16px);letter-spacing:.5em;
  text-transform:uppercase;color:#C9A96A;padding-left:.5em;font-weight:500;position:relative}
.backpage .bp-stars{margin-top:clamp(26px,5vh,54px);font-size:clamp(12px,5vw,30px);color:#C9A96A;
  letter-spacing:.34em;padding-left:.34em;position:relative}
.backpage .bp-quote{margin-top:clamp(16px,3vh,28px);font-family:'Cormorant Garamond',serif;font-style:italic;
  font-weight:500;font-size:clamp(12px,5.4vw,32px);line-height:1.5;color:#F4F0E6;position:relative}
.backpage .bp-attrib{margin-top:clamp(18px,3vh,28px);font-size:clamp(12px,2.7vw,17px);color:#8D8778;
  letter-spacing:.08em;position:relative}
.backpage .bp-fine{position:absolute;left:clamp(22px,6vw,40px);right:clamp(22px,6vw,40px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 40px);font-size:clamp(12px,2.4vw,14px);line-height:1.7;color:#7C7566;letter-spacing:.02em}
.backpage .bp-fine b{color:#C9A96A;letter-spacing:.22em;font-weight:600;margin-right:.5em}

/* list pages */
.listpage{width:100%;max-width:620px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 92px) clamp(16px,5vw,34px)
  calc(env(safe-area-inset-bottom,0px) + 60px);background:#000}
.listpage .lp-eyebrow{text-align:center;font-size:clamp(14px,2.4vw,17px);letter-spacing:.9em;
  color:#8D8778;text-transform:uppercase;padding-left:.9em;font-weight:500;margin-top:14px}
.listpage .lp-rule{width:110px;height:1px;margin:16px auto 0;
  background:linear-gradient(90deg,transparent,rgba(201,169,106,.55),transparent)}
.listpage .lp-title{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;
  font-weight:500;font-size:clamp(38px,11vw,62px);color:#F4F0E6;margin-top:14px;line-height:1.05}
.listpage .lp-cat{font-size:clamp(14px,3.1vw,18px);letter-spacing:.24em;text-transform:uppercase;
  color:#C9A96A;font-weight:600;margin:38px 0 4px;padding-left:.24em}
.listpage .lp-cat:first-of-type{margin-top:34px}
.listpage .lp-row{display:flex;align-items:baseline;gap:10px;padding:11px 0}
.listpage .lp-nm{font-size:clamp(15px,4.2vw,22px);color:#EDE7DC;font-weight:500;line-height:1.25}
.listpage .lp-nm .sub{font-size:.76em;color:#CFC7B4;font-weight:600;margin-left:10px;white-space:nowrap}
.listpage .lp-dots{flex:1;min-width:16px;border-bottom:1px dotted rgba(255,255,255,.2);transform:translateY(-5px)}
.listpage .lp-pr{font-size:clamp(15px,4.2vw,22px);color:#C9A96A;font-weight:600;white-space:nowrap}
.listpage .lp-end{text-align:center;font-size:clamp(14px,2.2vw,16px);letter-spacing:.4em;
  color:#4C4840;text-transform:uppercase;margin-top:46px;padding-left:.4em}
.l-eyebrow{position:absolute;top:150px;width:100%;text-align:center;font-size:41px;letter-spacing:1.2em;
  color:#8D8778;text-transform:uppercase;padding-left:1.2em;font-weight:500}
.l-rule{position:absolute;top:230px;left:50%;transform:translateX(-50%);width:150px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,169,106,.5),transparent)}
.l-title{position:absolute;top:280px;width:100%;text-align:center;font-family:'Cormorant Garamond',serif;
  font-style:italic;font-weight:500;font-size:180px;color:#F4F0E6}
.cols{position:absolute;top:560px;left:120px;right:120px;display:flex;gap:110px}
.col{flex:1}
.cat{font-size:48px;letter-spacing:.22em;text-transform:uppercase;color:#C9A96A;font-weight:600;margin:0 0 26px}
.cat:not(:first-child){margin-top:48px}
.lrow{display:flex;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.lrow .nm{font-size:55px;color:#EDE7DC;font-weight:500;white-space:nowrap}
.lrow .nm .sub{font-size:41px;color:#CFC7B4;font-weight:600;margin-left:18px}
.lrow .dots{flex:1;border-bottom:1px dotted rgba(255,255,255,.18);transform:translateY(-8px)}
.lrow .pr{font-size:55px;color:#C9A96A;font-weight:600;white-space:nowrap}
.l-foot{position:absolute;bottom:90px;width:100%;text-align:center;font-size:31px;letter-spacing:.4em;
  color:#565144;text-transform:uppercase;font-weight:500}

/* ================= LIVE SHOWS ================= */
#shows{position:fixed;inset:0;z-index:20;display:none;background:#000;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch}
#shows.on{display:block}
#shows::-webkit-scrollbar{width:0}
.showsback{position:fixed;z-index:23;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;
  border:1px solid rgba(201,169,106,.34);background:rgba(0,0,0,.55);color:#EFEBE2;
  font:500 13.5px/1 'Jost',sans-serif;letter-spacing:.22em;text-transform:uppercase;padding:13.5px 21.5px;
  border-radius:999px;cursor:pointer;backdrop-filter:blur(8px);display:none;align-items:center;gap:8px}
#shows.on ~ .showsback,.showsback.on{display:inline-flex}
.showswrap{width:100%;max-width:620px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 92px) clamp(16px,5vw,34px) calc(env(safe-area-inset-bottom,0px) + 54px)}
.shows-eyebrow{text-align:center;font-size:clamp(13px,2.4vw,17px);letter-spacing:.68em;color:#8D8778;
  text-transform:uppercase;padding-left:.68em;font-weight:500;margin-top:14px}
.shows-rule{width:110px;height:1px;margin:16px auto 0;
  background:linear-gradient(90deg,transparent,rgba(201,169,106,.55),transparent)}
.shows-title{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
  font-size:clamp(38px,11vw,62px);color:#F4F0E6;margin-top:14px;line-height:1.05}
.ev{position:relative;display:flex;align-items:center;margin-top:14px;min-height:94px;
  border:1px solid rgba(201,169,106,.28);border-radius:12px;overflow:hidden;background:#0a0a0a;cursor:pointer}
.ev-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%;opacity:.55}
.ev-scrim{position:absolute;inset:0;
  background:linear-gradient(90deg,#000 0%,rgba(0,0,0,.86) 50%,rgba(0,0,0,.28) 100%)}
.ev-date{position:relative;flex:0 0 auto;width:clamp(78px,23vw,100px);text-align:center}
.ev-d{font-size:clamp(17px,4.6vw,22px);color:#C9A96A;font-weight:600;letter-spacing:.03em;
  font-variant-numeric:tabular-nums}
.ev-day{margin-top:4px;font-size:clamp(10px,2.6vw,12px);letter-spacing:.16em;text-transform:uppercase;
  color:#CFC7B4;font-weight:600}
.ev-txt{position:relative;min-width:0;flex:1 1 auto;padding-right:8px}
.ev-nm{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
  font-size:clamp(20px,5.6vw,30px);color:#F4F0E6;line-height:1.1}
.ev-gen{margin-top:4px;font-size:clamp(8px,2vw,11px);letter-spacing:.22em;text-transform:uppercase;color:#C9A96A}
.ev-arw{position:relative;flex:0 0 auto;padding:0 14px;color:#C9A96A;font-size:clamp(13px,3.2vw,17px)}
.shows-empty{margin-top:30px;text-align:center;color:#6B6558;font-style:italic;font-size:15px}
.wk-h{margin-top:46px;text-align:center;font-size:clamp(11px,2.4vw,14px);letter-spacing:.5em;
  text-transform:uppercase;color:#8D8778;padding-left:.5em;font-weight:500}
.wk{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}
.wkc{position:relative;min-height:92px;border:1px solid rgba(201,169,106,.22);border-radius:12px;
  overflow:hidden;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:16px}
.wkc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.wkc .sc{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.82))}
.wkc .nm{position:relative;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
  font-size:clamp(19px,5vw,26px);color:#F4F0E6;line-height:1.15}
.wkc .wh{position:relative;margin-top:5px;font-size:clamp(8px,2vw,11px);letter-spacing:.2em;
  text-transform:uppercase;color:#C9A96A}
.shows-foot{margin-top:42px;text-align:center;font-size:clamp(10px,2.4vw,13px);letter-spacing:.32em;
  text-transform:uppercase;color:#8D8778;padding-left:.32em}
@media (min-width:700px){.wk{grid-template-columns:repeat(3,1fr)}}

/* event page: same typography as an item page, but the poster is shown whole */
.itempage .herobox.posterbox img{object-fit:contain;transform:none;max-width:100%;max-height:100%}
.itempage .herobox.posterbox::after{display:none}
.itempage .posterbox .noposter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  border:1px dashed rgba(201,169,106,.3);border-radius:12px;color:#6B6558;font-size:13px;
  letter-spacing:.24em;text-transform:uppercase}
.itempage .ev-when{margin-top:.55em;font-size:clamp(13px,3vw,20px);letter-spacing:.22em;
  text-transform:uppercase;color:#C9A96A;padding-left:.22em}

/* chrome */
#bars{position:fixed;top:0;left:0;right:0;z-index:21;display:flex;gap:2px;padding:0 8px;
  margin-top:calc(env(safe-area-inset-top,0px) + 4px);transition:opacity .35s}
.bar{flex:1;height:2px;background:transparent;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#C9A96A}
.bar.done i{width:100%}
#top{position:fixed;top:0;left:0;right:0;z-index:22;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;
  background:linear-gradient(180deg,rgba(0,0,0,.88),rgba(0,0,0,0));transition:opacity .35s}
#back{border:1px solid rgba(201,169,106,.34);background:rgba(255,255,255,.10);color:#EFEBE2;
  font:500 13.5px/1 'Jost',sans-serif;letter-spacing:.22em;text-transform:uppercase;padding:13.5px 21.5px;
  border-radius:999px;cursor:pointer;backdrop-filter:blur(8px);display:inline-flex;align-items:center;gap:8px}
#sect{display:none}
#count{font-size:12px;letter-spacing:.16em;color:#8D8778;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
#top.hide,#bars.hide{opacity:0}
.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:21;width:50px;height:50px;border-radius:50%;
  border:1px solid rgba(201,169,106,.35);background:rgba(0,0,0,.42);color:#C9A96A;font-size:19px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
#prev{left:20px}#next{right:20px}
.nav.hide{opacity:0;pointer-events:none}
.nav.scrollhide{opacity:0;pointer-events:none}
@media (max-width:699px){
  .nav{width:34px;height:96px;border-radius:0;background:rgba(0,0,0,.5)}
  #prev{left:0;border-left:none;border-top-right-radius:10px;border-bottom-right-radius:10px}
  #next{right:0;border-right:none;border-top-left-radius:10px;border-bottom-left-radius:10px}
}
#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);left:0;right:0;z-index:21;text-align:center;
  font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#6B6558;transition:opacity .6s;pointer-events:none}
@media (max-height:760px){#hint{display:none}}
#hint.hide{opacity:0}
</style></head>
<body>

<div id="home">
