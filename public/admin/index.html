<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Vibration &middot; Editor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/admin.css" />
  </head>
  <body>
    <section id="login-view" class="login" hidden>
      <div class="login-card">
        <div class="eyebrow">Vibration</div>
        <div class="serif">Editor</div>
        <div class="rule"></div>
        <form id="login-form">
          <label class="field">
            <span class="field-label">Password</span>
            <input id="password" type="password" autocomplete="current-password" required enterkeyhint="go" />
          </label>
          <p id="login-error" class="error" role="alert" hidden></p>
          <button type="submit" class="btn btn-gold btn-block">Sign in</button>
        </form>
      </div>
    </section>

    <section id="editor-view" hidden>
      <header class="topbar">
        <button id="nav-back" class="btn btn-quiet" type="button" hidden>&#10094;</button>
        <div class="serif" id="nav-title">Editor</div>
        <div class="topbar-actions">
          <a class="btn btn-quiet" href="/" target="_blank" rel="noopener">View</a>
          <button id="logout" type="button" class="btn btn-quiet">Sign out</button>
        </div>
      </header>

      <main class="wrap" id="screen"></main>

      <div class="savebar">
        <span id="save-status" class="save-status">All changes saved</span>
        <button id="save" type="button" class="btn btn-gold" disabled>Save</button>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" hidden />

    <script src="/assets/admin.js" type="module"></script>
  </body>
</html>
