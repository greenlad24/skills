<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Vibration &middot; Menu Editor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/admin.css" />
  </head>
  <body>
    <!-- Sign in -->
    <section id="login-view" class="login" hidden>
      <div class="login-card">
        <div class="eyebrow">Vibration</div>
        <div class="serif">Menu Editor</div>
        <div class="rule"></div>
        <form id="login-form">
          <label class="field">
            <span class="field-label">Password</span>
            <input id="password" type="password" autocomplete="current-password" required enterkeyhint="go" />
          </label>
          <p id="login-error" class="error" role="alert" hidden></p>
          <button type="submit" class="btn btn-gold btn-block">Sign in</button>
        </form>
      </div>
    </section>

    <!-- Editor -->
    <section id="editor-view" hidden>
      <header class="topbar">
        <div class="serif">Menu Editor</div>
        <div class="topbar-actions">
          <a class="btn btn-quiet" href="/" target="_blank" rel="noopener">View</a>
          <button id="logout" type="button" class="btn btn-quiet">Sign out</button>
        </div>
      </header>

      <main class="wrap">
        <details class="panel">
          <summary>
            <span class="serif">Cover</span>
            <span class="chev">&#10095;</span>
          </summary>
          <div class="panel-body">
            <label class="field">
              <span class="field-label">Tagline</span>
              <input id="brand-tag" type="text" />
              <p class="hint">Shown under the logo on the cover screen.</p>
            </label>
            <label class="field">
              <span class="field-label">Footer</span>
              <input id="brand-foot" type="text" />
            </label>
          </div>
        </details>

        <div id="sections"></div>
      </main>

      <div class="savebar">
        <span id="save-status" class="save-status">All changes saved</span>
        <button id="save" type="button" class="btn btn-gold" disabled>Save</button>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="/assets/admin.js" type="module"></script>
  </body>
</html>
