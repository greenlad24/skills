[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'no build step - static site with serverless functions'"

[functions]
  node_bundler = "esbuild"

# The admin shell is a static page that contains no menu data of its own;
# every byte of menu content is served by the authenticated /api/admin/* routes.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
