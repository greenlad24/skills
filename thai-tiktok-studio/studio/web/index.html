<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Thai TikTok Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23fe2c55%22/%3E%3Cpath d=%22M12 9l12 7-12 7z%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="nav.skip">ข้ามไปเนื้อหา</a>
<header class="topbar">
  <a class="brand" href="#/home" aria-label="Thai TikTok Studio"><span class="logo" aria-hidden="true">▶</span><span class="brand-name">TikTok Studio</span></a>
  <div class="top-right">
    <label class="lang-wrap"><span aria-hidden="true">🌐</span>
      <select id="langSel" class="lang-sel" aria-label="ภาษา / Language">
        <option value="th">ไทย</option><option value="en">English</option>
      </select></label>
    <button class="iconbtn" id="btnHelp" data-i18n-aria="nav.help" aria-label="วิธีใช้">❓</button>
    <button class="iconbtn" id="btnSettings" data-i18n-aria="nav.settings" aria-label="ตั้งค่า">⚙️</button>
  </div>
</header>
<div id="updBar" class="upd-bar hidden" role="status" aria-live="polite"></div>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main" tabindex="-1"><div class="loading-screen"><div class="spinner"></div></div></main>
</div>
<nav class="bottomnav" id="bottomnav"></nav>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box"><button class="iconbtn modal-x" id="modalX" data-i18n-aria="common.close" aria-label="ปิด">✕</button><div id="modalBody"></div></div></div>
<div id="dialog" class="modal dialog hidden" role="alertdialog" aria-modal="true"><div class="modal-box small"><div id="dialogBody"></div></div></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
