<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thai TikTok Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23fe2c55%22/%3E%3Cpath d=%22M12 9l12 7-12 7z%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo">▶</span> Thai TikTok Studio <small id="ver"></small></div>
  <div class="hdr-right">
    <span id="health" class="health"></span>
    <button class="ghost" id="btnHelp">❓ วิธีใช้</button>
    <button class="ghost" id="btnSettings">⚙ Settings</button>
  </div>
</header>
<div class="layout">
  <aside>
    <button class="primary wide" id="btnNew">＋ New product</button>
    <button class="secondary wide" id="btnSched" style="margin-top:8px">📅 ตั้งเวลาโพสต์ TikTok</button>
    <div class="side-title">Products</div>
    <ul id="projectList"></ul>
  </aside>
  <main id="main"></main>
</div>

<template id="tplNew">
  <section class="card">
    <h1>New product → 5 viral Thai videos</h1>
    <p class="muted">Paste a product name or link (TikTok Shop, Shopee, Lazada, brand site) and/or drop screenshots.
      The tool researches the product and the niche, then writes 5 ranked scripts, Thai shot lists, and exact edit plans.</p>
    <label>Product name or link</label>
    <textarea id="newText" rows="3" placeholder="e.g. ที่นอน Solomon Pyla Plus 6 ฟุต   or   https://shop.tiktok.com/..."></textarea>
    <label>Screenshots (optional)</label>
    <div class="drop" id="newDrop">Drop screenshots here or <u>browse</u><input type="file" id="newFiles" accept="image/*" multiple hidden></div>
    <div id="newThumbs" class="thumbs"></div>
    <label>Notes for the scriptwriter (optional)</label>
    <input id="newNotes" placeholder="e.g. creator is a woman in her 30s, real price 2,990฿, free shipping, has อย. number">
    <div class="row">
      <button class="primary" id="btnGenerate">Generate videos</button>
      <span class="muted" id="providerNote"></span>
    </div>
  </section>
</template>

<div id="modal" class="modal hidden"><div class="modal-box"><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
