[sender]
server = SHOW-SERVER-IP      ; the show server address (numbers like 159.203.10.20) - ask Claude in VibeNation for it
port = 9000
device = X-AIR               ; part of the MR18 audio device name; run "run.bat --list" to see names
channels = 16
latency_ms = 500             ; SRT re-send window: higher = more robust on bad internet
passphrase =                 ; must match VN_VENUE_PASSPHRASE on the show server (10-79 letters/numbers)
